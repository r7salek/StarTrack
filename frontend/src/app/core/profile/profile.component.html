<section class="account-page" *ngIf="currentUser; else loggedOut">
  <h1>Your account</h1><p>Your signed-in identity and access to StarTrack.</p>
  <dl><dt>Name</dt><dd>{{ currentUser.displayName || 'Not recorded' }}</dd><dt>Email</dt><dd>{{ currentUser.email }}</dd><dt>Roles</dt><dd><span *ngFor="let role of currentUser.roles">{{ role }} </span></dd></dl>
  <a mat-flat-button color="primary" routerLink="/user">Manage profile and password</a>
</section><ng-template #loggedOut><p>Please <a routerLink="/login">sign in</a> to view your account.</p></ng-template>
