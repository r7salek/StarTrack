<header class="site-header">
  <nav aria-label="Main navigation">
    <a class="brand" routerLink="/home" aria-label="StarTrack home">StarTrack<span>OTR Project and Impact Tracker</span></a>
    <div class="nav-links">
      <a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">Home</a>
      <ng-container *ngIf="isLoggedIn; else publicNavigation">
        <a routerLink="/projects" routerLinkActive="active" ariaCurrentWhenActive="page">Projects</a>
        <a routerLink="/createProject" *ngIf="isUser || isAdmin" routerLinkActive="active" ariaCurrentWhenActive="page">Create project</a>
        <a routerLink="/user-management" *ngIf="isAdmin" routerLinkActive="active" ariaCurrentWhenActive="page">User management</a>
        <button mat-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu">{{ firstName || 'Account' }} <mat-icon>expand_more</mat-icon></button>
        <mat-menu #accountMenu="matMenu">
          <a mat-menu-item routerLink="/user">Profile</a>
          <button mat-menu-item (click)="logout()">Sign out</button>
        </mat-menu>
      </ng-container>
      <ng-template #publicNavigation>
        <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Sign in</a>
        <a class="st-button st-button-primary" routerLink="/register">Register</a>
      </ng-template>
    </div>
  </nav>
</header>
