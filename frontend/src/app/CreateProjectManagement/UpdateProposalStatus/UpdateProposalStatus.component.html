<section class="status-dialog" aria-labelledby="status-heading">
  <h2 mat-dialog-title id="status-heading">Change project status</h2>
  <p>This saves a new version. Earlier versions remain in project history.</p>
  <form [formGroup]="service.form" (ngSubmit)="onUpdateUserPerm(service.form.value.id, service.form.value.applyValue)">
    <mat-form-field appearance="outline">
      <mat-label>Project status</mat-label>
      <mat-select formControlName="applyValue" [disabled]="isSaving" required>
        <mat-option value="SUBMITTED">Submitted</mat-option>
        <mat-option value="ACCEPTED">Accepted</mat-option>
        <mat-option value="REJECTED">Rejected</mat-option>
        <mat-option value="CLOSED">Closed</mat-option>
      </mat-select>
    </mat-form-field>
    <p *ngIf="error" class="st-error" role="alert">{{ error }}</p>
    <p *ngIf="isSaving" role="status">Saving project status…</p>
    <div class="actions">
      <button type="button" mat-stroked-button (click)="onClose()" [disabled]="isSaving">Cancel</button>
      <button type="submit" mat-flat-button color="primary" [disabled]="isSaving">{{ isSaving ? 'Saving…' : 'Save status' }}</button>
    </div>
  </form>
</section>
