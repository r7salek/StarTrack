<section class="account-dialog"><h2>Change your password</h2><p>Use at least six characters and enter the same password twice.</p>
<form [formGroup]="registerForm" stFocusInvalid (ngSubmit)="updateUserPassword(registerForm.value)">
<fieldset [disabled]="isSaving">
<mat-form-field appearance="outline"><mat-label>New password</mat-label><input matInput autocomplete="new-password" minlength="6" formControlName="password" required [type]="hide ? 'password' : 'text'"><button mat-icon-button matSuffix type="button" (click)="hide = !hide" [attr.aria-label]="hide ? 'Show new password' : 'Hide new password'" [attr.aria-pressed]="!hide"><mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon></button><mat-error>Enter at least six characters.</mat-error></mat-form-field>
<mat-form-field appearance="outline"><mat-label>Confirm new password</mat-label><input matInput autocomplete="new-password" minlength="6" formControlName="confirmPassword" required [type]="hide1 ? 'password' : 'text'"><button mat-icon-button matSuffix type="button" (click)="hide1 = !hide1" [attr.aria-label]="hide1 ? 'Show confirmation password' : 'Hide confirmation password'" [attr.aria-pressed]="!hide1"><mat-icon>{{ hide1 ? 'visibility_off' : 'visibility' }}</mat-icon></button><mat-error>Passwords must match and contain at least six characters.</mat-error></mat-form-field>
</fieldset><p *ngIf="error" class="st-error" role="alert">{{ error }}</p>
<div class="actions"><button mat-stroked-button type="button" (click)="onClose()" [disabled]="isSaving">Cancel</button><button mat-flat-button color="primary" type="submit" [disabled]="isSaving">{{ isSaving ? 'Saving…' : 'Save password' }}</button></div></form></section>
