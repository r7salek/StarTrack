<section class="account-dialog"><h2 mat-dialog-title>Edit your profile</h2>
<p *ngIf="isLoading" role="status">Loading profile…</p>
<p *ngIf="error" class="st-error" role="alert">{{ error }}</p>
<form [formGroup]="service.form" stFocusInvalid (ngSubmit)="updateUserProfile(service.form.value)">
<fieldset [disabled]="isSaving || isLoading">
<mat-form-field appearance="outline"><mat-label>First name</mat-label><input matInput formControlName="firstName" autocomplete="given-name" required minlength="3" maxlength="20"><mat-hint>3–20 characters</mat-hint><mat-error>Enter a first name of 3–20 characters.</mat-error></mat-form-field>
<mat-form-field appearance="outline"><mat-label>Last name</mat-label><input matInput formControlName="lastName" autocomplete="family-name" required minlength="3" maxlength="20"><mat-hint>3–20 characters</mat-hint><mat-error>Enter a last name of 3–20 characters.</mat-error></mat-form-field>
<mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" formControlName="email" autocomplete="email" required pattern="^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$"><mat-error>Enter a valid email address.</mat-error></mat-form-field>
</fieldset><div class="actions"><button mat-stroked-button type="button" (click)="onClose()" [disabled]="isSaving">Cancel</button><button mat-flat-button color="primary" type="submit" [disabled]="isSaving || isLoading">{{ isSaving ? 'Saving…' : 'Save profile' }}</button></div></form></section>
