<section class="account-page">
<h1>Manage your account</h1><p>Review your details or change your password.</p>
<p *ngIf="isLoading" role="status">Loading your profile…</p>
<div *ngIf="error" role="alert"><p>{{ error }}</p><button mat-stroked-button type="button" (click)="getUsers()">Try again</button></div>
<div *ngIf="!isLoading && !error">
<dl><dt>First name</dt><dd>{{ service.form.value.firstName }}</dd><dt>Last name</dt><dd>{{ service.form.value.lastName }}</dd><dt>Email</dt><dd>{{ service.form.value.email }}</dd></dl>
<div class="actions"><button mat-flat-button color="primary" type="button" (click)="UpdateUserProfile(service.form.value)">Edit profile</button><button mat-stroked-button type="button" (click)="ChangePassword()">Change password</button></div>
</div></section>
