<section class="account-dialog"><h2>Change account roles</h2><p>Roles determine which account-management controls a person can use.</p>
<p *ngIf="isLoading" role="status">Loading roles…</p><p *ngIf="error" role="alert" class="st-error">{{ error }}</p>
<form [formGroup]="service.form" stFocusInvalid (ngSubmit)="onUpdateUserRole(service.form.value.email, service.form.value.role)">
<mat-form-field appearance="outline"><mat-label>Account email</mat-label><input matInput formControlName="email" readonly></mat-form-field>
<mat-form-field appearance="outline"><mat-label>Roles</mat-label><mat-select formControlName="role" required multiple [disabled]="isSaving || isLoading"><mat-option *ngFor="let role of roleList" [value]="role.description">{{ role.description }}</mat-option></mat-select><mat-error>Select at least one role.</mat-error></mat-form-field>
<div class="actions"><button mat-stroked-button type="button" (click)="onClose()" [disabled]="isSaving">Cancel</button><button mat-flat-button color="primary" type="submit" [disabled]="isSaving || isLoading">{{ isSaving ? 'Saving…' : 'Save roles' }}</button></div></form></section>
